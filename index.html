<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vv</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    padding: 1.5rem;
  }

  .screen {
    text-align: center;
    animation: blink 1.1s step-start infinite;
    max-width: 100%;
  }

  .code {
    font-size: clamp(2rem, 10vw, 6rem);
    font-weight: bold;
    color: #ff2020;
    letter-spacing: 0.05em;
    line-height: 1.1;
    word-break: break-word;
  }

  .label {
    font-size: clamp(0.8rem, 3.5vw, 1.2rem);
    color: #ff2020;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 1rem;
    word-break: break-word;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>

<body>
  <div class="screen">
    <div class="code">domain owned by vv productions</div>
    <div class="label">im cooking something up rn</div>
  </div>
</body>
</html>
